<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ app_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex" style="font-family:'Inter',sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#0f172a 100%)">

<div class="fixed inset-0 overflow-hidden pointer-events-none">
  <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full opacity-20" style="background:radial-gradient(circle,#3b82f6,transparent)"></div>
  <div class="absolute -bottom-40 -left-40 w-80 h-80 rounded-full opacity-10" style="background:radial-gradient(circle,#6366f1,transparent)"></div>
</div>

<div class="relative m-auto w-full max-w-sm px-4">

  <!-- Brand -->
  <div class="text-center mb-8">
    <div class="inline-flex w-16 h-16 rounded-2xl bg-blue-600 items-center justify-center shadow-2xl shadow-blue-900/60 mb-4">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-white tracking-tight">{{ app_name }}</h1>
    <p class="text-blue-300 text-sm mt-1 font-medium">Billing & Network Management</p>
  </div>

  <div class="rounded-3xl p-7 shadow-2xl" style="background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12)">

    <!-- Error -->
    {% if error %}
    <div class="flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm text-red-300 mb-5" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <!-- Tab switcher -->
    <div class="flex rounded-xl p-1 mb-6" style="background:rgba(255,255,255,0.06)">
      <button id="tab-pass" onclick="switchTab('pass')"
        class="flex-1 py-2 rounded-lg text-sm font-semibold transition-all text-white"
        style="background:rgba(37,99,235,0.8)">
        Password
      </button>
      <button id="tab-wa" onclick="switchTab('wa')"
        class="flex-1 py-2 rounded-lg text-sm font-semibold transition-all text-blue-300">
        PIN WhatsApp
      </button>
    </div>

    <!-- Form Password -->
    <div id="form-pass">
      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-blue-200 uppercase tracking-widest mb-2">Username</label>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <input type="text" name="username" placeholder="Masukkan username" autofocus
              class="w-full pl-10 pr-4 py-3 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
              style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-200 uppercase tracking-widest mb-2">Password</label>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input type="password" name="password" placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
              style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
          </div>
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 transition-all hover:opacity-90"
          style="background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 8px 24px rgba(37,99,235,0.35)">
          Masuk ke Dashboard
        </button>
      </form>
    </div>

    <!-- Form WA PIN -->
    <div id="form-wa" class="hidden">
      <!-- Step 1: Kirim PIN -->
      <div id="wa-step1">
        <p class="text-blue-200 text-xs mb-4">Masukkan nomor WhatsApp yang terdaftar, kami kirimkan PIN 6 digit.</p>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-blue-200 uppercase tracking-widest mb-2">Nomor WhatsApp</label>
            <div class="relative">
              <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              <input type="text" id="nomor-wa" placeholder="08xxxxxxxxxx"
                class="w-full pl-10 pr-4 py-3 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
            </div>
          </div>
          <button onclick="kirimPin()"
            class="w-full py-3 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 transition-all hover:opacity-90"
            style="background:linear-gradient(135deg,#059669,#047857)">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Kirim PIN ke WhatsApp
          </button>
          <p id="wa-msg" class="text-center text-xs hidden"></p>
        </div>
      </div>

      <!-- Step 2: Masukkan PIN -->
      <div id="wa-step2" class="hidden">
        <p class="text-emerald-300 text-xs mb-4 text-center">✅ PIN dikirim! Cek WhatsApp kamu dan masukkan PIN 6 digit.</p>
        <form method="post" action="/login/wa/verifikasi" class="space-y-4">
          <input type="hidden" name="nomor_wa" id="hidden-nomor">
          <div>
            <label class="block text-xs font-semibold text-blue-200 uppercase tracking-widest mb-2">PIN 6 Digit</label>
            <input type="text" name="otp" maxlength="6" placeholder="123456" autofocus
              class="w-full px-4 py-3 rounded-xl text-white text-center text-2xl font-bold tracking-widest placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
              style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
          </div>
          <button type="submit"
            class="w-full py-3 rounded-xl text-sm font-bold text-white transition-all hover:opacity-90"
            style="background:linear-gradient(135deg,#2563eb,#1d4ed8)">
            Verifikasi & Masuk
          </button>
          <button type="button" onclick="showStep1()" class="w-full text-blue-400 text-xs hover:text-blue-300 transition py-1">
            ← Ganti nomor WA
          </button>
        </form>
      </div>
    </div>

  </div>

  <p class="text-center text-blue-900/40 text-xs mt-6">© 2026 {{ app_name }} · Billing Management System</p>
</div>

<script>
const activeTab = "{{ tab or 'pass' }}";

function switchTab(t) {
  const isPass = t === 'pass';
  document.getElementById('form-pass').classList.toggle('hidden', !isPass);
  document.getElementById('form-wa').classList.toggle('hidden', isPass);
  document.getElementById('tab-pass').style.background = isPass ? 'rgba(37,99,235,0.8)' : '';
  document.getElementById('tab-pass').style.color = isPass ? 'white' : '';
  document.getElementById('tab-wa').style.background = !isPass ? 'rgba(37,99,235,0.8)' : '';
  document.getElementById('tab-wa').style.color = !isPass ? 'white' : 'rgb(147,197,253)';
}

function showStep1() {
  document.getElementById('wa-step1').classList.remove('hidden');
  document.getElementById('wa-step2').classList.add('hidden');
}

async function kirimPin() {
  const nomor = document.getElementById('nomor-wa').value.trim();
  if (!nomor) return;
  const msg = document.getElementById('wa-msg');
  msg.textContent = 'Mengirim PIN...';
  msg.className = 'text-center text-xs text-blue-300';
  msg.classList.remove('hidden');
  const fd = new FormData();
  fd.append('nomor_wa', nomor);
  const res = await fetch('/login/wa/kirim', { method: 'POST', body: fd });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('hidden-nomor').value = nomor;
    document.getElementById('wa-step1').classList.add('hidden');
    document.getElementById('wa-step2').classList.remove('hidden');
  } else {
    msg.textContent = data.msg;
    msg.className = 'text-center text-xs text-red-400';
  }
}

if (activeTab === 'wa') switchTab('wa');
</script>
</body>
</html>
