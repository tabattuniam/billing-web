<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ app_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex" style="font-family:'Inter',sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#0f172a 100%)">

<!-- Decorative blobs -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
  <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full opacity-20" style="background:radial-gradient(circle,#3b82f6,transparent)"></div>
  <div class="absolute -bottom-40 -left-40 w-80 h-80 rounded-full opacity-10" style="background:radial-gradient(circle,#6366f1,transparent)"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-5"
    style="background-image:radial-gradient(circle,white 1px,transparent 1px);background-size:32px 32px"></div>
</div>

<div class="relative m-auto w-full max-w-sm px-4">

  <div class="text-center mb-8">
    <div class="inline-flex w-16 h-16 rounded-2xl bg-blue-600 items-center justify-center shadow-2xl shadow-blue-900/60 mb-4">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-white tracking-tight">{{ app_name }}</h1>
    <p class="text-blue-300 text-sm mt-1 font-medium">Billing & Network Management</p>
  </div>

  <div class="rounded-3xl p-7 shadow-2xl" style="background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12)">

    {% if error %}
    <div class="flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm text-red-300 mb-5" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-blue-200 uppercase tracking-widest mb-2">Username</label>
        <div class="relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <input type="text" name="username" required autofocus placeholder="Masukkan username"
            class="w-full pl-10 pr-4 py-3 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-blue-200 uppercase tracking-widest mb-2">Password</label>
        <div class="relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full pl-10 pr-4 py-3 rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
        </div>
      </div>
      <div class="pt-1">
        <button type="submit"
          class="w-full py-3 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 transition-all duration-200 hover:opacity-90 active:scale-[0.98]"
          style="background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 8px 24px rgba(37,99,235,0.35)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14"/></svg>
          Masuk ke Dashboard
        </button>
      </div>
    </form>
  </div>

  <p class="text-center text-blue-900/50 text-xs mt-6">© 2024 {{ app_name }} · Billing Management System</p>
</div>
</body>
</html>
