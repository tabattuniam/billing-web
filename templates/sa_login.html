<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Login — {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Platform Admin</h1>
      <p class="text-slate-400 text-sm mt-1">{{ app_name }}</p>
    </div>

    {% if error %}
    <div class="bg-red-900/40 border border-red-700 text-red-300 rounded-xl px-4 py-3 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/sa/login" class="bg-slate-800 rounded-2xl p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
        <input type="text" name="username" autocomplete="username"
               class="w-full bg-slate-700 text-white rounded-xl px-4 py-2.5 border border-slate-600 focus:outline-none focus:border-indigo-500"
               placeholder="superadmin" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password"
               class="w-full bg-slate-700 text-white rounded-xl px-4 py-2.5 border border-slate-600 focus:outline-none focus:border-indigo-500"
               required>
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition">
        Login
      </button>
    </form>
  </div>
</body>
</html>
